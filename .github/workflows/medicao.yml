name: Medição de Energia — orange3

# Opção C: workflow dedicado que invoca o run_pipeline.sh existente (mesmo
# padrão de sktime/yolov5/VW/PL/ncnn), rodando no self-hosted runner (tesla).
# Não substitui nem altera o test.yml original. ÚNICO ARQUIVO TOCADO NO FORK.
#
# Célula de referência espelhada: job `test_on_linux` do test.yml upstream,
# ubuntu-latest / Python 3.11 / tox_env=orange-released — 1 de 20 combinações
# da matriz. SHA pinado: f7cee7e8337d166945d1a48322dd9b0b765ef432

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "validacao = apenas run 0 (smoke test) | completa = warm-up + runs 1..10 + mediana"
        type: choice
        required: true
        default: validacao
        options:
          - validacao
          - completa

jobs:
  medicao:
    runs-on: [self-hosted, linux]
    env:
      # O contexto `env` do Actions nao expoe o HOME do processo do runner: a
      # interpolacao resolvia para string vazia e o upload-artifact nao achava
      # nada. NUNCA usar ${{ env.HOME }} (bug já corrigido em PL e VW).
      HOME_DIR: /home/maycon
    # build + test (sem train — orange3 é inference-only) + baseline 120s/run.
    # Estimativa: ~16 min/run → campanha completa ≈ 3,3 h (faixa 2,7-4,6 h).
    timeout-minutes: 1200

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          submodules: false   # projeto já está inteiro na imagem Docker

      - name: Permitir leitura dos contadores RAPL
        run: sudo /usr/local/bin/rapl-set-readable

      - name: Verificar disponibilidade do RAPL
        run: |
          if [ ! -d /sys/class/powercap/intel-rapl ]; then
            echo "❌ RAPL não disponível neste runner"
            exit 1
          fi
          echo "✅ Domínios RAPL disponíveis:"
          ls /sys/class/powercap/intel-rapl/

      - name: Verificar imagem Docker
        run: |
          if ! docker image inspect orange3-medicao &>/dev/null; then
            echo "❌ Imagem 'orange3-medicao' não encontrada no runner."
            echo "   Build manual na tesla antes de disparar este workflow:"
            echo "   docker build -t orange3-medicao \\"
            echo "     -f ~/experimentos/medicao/repositorios/orange3/Dockerfile \\"
            echo "     ~/experimentos/repositorios/inference-only/orange3/"
            exit 1
          fi
          echo "✅ Imagem Docker encontrada."
          docker image inspect orange3-medicao --format '{{.Created}}'

      # --- MODO validacao: apenas run 0, resultado não conta para a mediana ---
      - name: Run de validação (run 0)
        if: ${{ inputs.campaign == 'validacao' }}
        run: |
          RESULTS_DIR="$HOME/experimentos/medicao/resultados/orange3/runs"
          bash "$HOME/experimentos/medicao/repositorios/orange3/run_pipeline.sh" 0
          # run 0 é smoke test: mover run_00.csv para fora de runs/ para não
          # entrar na agregação da mediana (aggregate.py globa runs/run_*.csv)
          mkdir -p "$RESULTS_DIR/validacao"
          if [ -f "$RESULTS_DIR/run_00.csv" ]; then
            mv -f "$RESULTS_DIR/run_00.csv" "$RESULTS_DIR/validacao/run_00.csv"
            echo "ℹ️  run_00.csv movido para runs/validacao/ (não conta para os resultados)"
          fi
          # Sanity check não bloqueante de user/sys (ver alertar_user_sys no modo completa).
          # ORANGE3: espera-se ratio > 0.5 nos DOIS stages — alerta é sinal REAL.
          awk -F, '
            NR==1 { next }
            ($2=="build" || $2=="test") && $7+0 > 0 {
              r = ($8 + $9) / $7
              if (r < 0.5)
                printf "::warning::[run 0] stage %s: (user+sys)/wall = %.4f < 0.5 (user=%ss sys=%ss wall=%ss) — captura de user/sys pode ter regredido para o host\n", $2, r, $8, $9, $7
            }
          ' "$RESULTS_DIR/validacao/run_00.csv"
          # Sanity check não bloqueante de paginação (ver alertar_swap no modo completa).
          awk -F, -v LIMIAR="${SWAP_WARN_PAGES:-256}" '
            NR==1 { next }
            NF >= 13 && ($2=="build" || $2=="test") && $13+0 > LIMIAR {
              printf "::warning::[run 0] stage %s: swap_out_pages=%s (swap_in_pages=%s, limiar %s) — houve paginação do host durante a janela medida; run suspeita por contenção de I/O\n", $2, $13, $12, LIMIAR
            }
          ' "$RESULTS_DIR/validacao/run_00.csv"

      # --- MODO completa: 10 runs oficiais + mediana (com skip-if-exists) ---
      - name: Executar 10 runs de medição
        if: ${{ inputs.campaign == 'completa' }}
        run: |
          RESULTS_DIR="$HOME/experimentos/medicao/resultados/orange3/runs"
          PIPELINE="$HOME/experimentos/medicao/repositorios/orange3/run_pipeline.sh"
          # Garantir que nenhum run_00.csv de validação polua a mediana
          rm -f "$RESULTS_DIR/run_00.csv"

          # Valida run_NN.csv: 3 stages (build/test/total) presentes e colunas
          # críticas (energy_pkg_j, energy_cores_j, wall_time_s) não-vazias e > 0.
          # user_time_s/sys_time_s NÃO entram na validação (não usados na análise).
          #
          # NOTA (D-2): a validação NÃO olha exit code, e isso é deliberado no
          # orange3. O stage `test` sai não-zero em TODA run, por design: os
          # 6 acessos de Orange/tests/test_url_reader.py a datasets.biolab.si não
          # têm skipIf nem mock, e 4 falham sob --network none. A run continua
          # VÁLIDA — o que importa é que energia e wall foram medidos. Os exit
          # codes ficam no sidecar exit_codes_run_NN.txt para auditoria.
          validar_csv() {
            local csv="$1"
            [ -f "$csv" ] || return 1
            awk -F, '
              NR==1 { next }
              $2=="build"||$2=="test"||$2=="total" {
                seen[$2]=1
                if ($3==""||$4==""||$7=="" || $3+0<=0 || $4+0<=0 || $7+0<=0) inval[$2]=1
              }
              END {
                split("build test total", req, " ")
                for (i in req) {
                  s=req[i]
                  if (!(s in seen)) exit 1
                  if (s in inval)   exit 1
                }
                exit 0
              }
            ' "$csv"
          }

          # Sanity check NÃO bloqueante de user/sys (mesmo mecanismo de PL/yolov5/VW/sktime).
          #
          # ⚠️  ATENÇÃO — A SEMÂNTICA AQUI É DIFERENTE DA DO SKTIME. Não copie a
          # leitura de lá. No sktime o `build` é `uv pip install --offline`, puro
          # I/O, e ratio < 0.5 no build era falso positivo ESPERADO e ignorável.
          #
          # No orange3 o `build` NÃO é I/O-bound: ele compila 11 extensões
          # (9 .pyx via cythonize + _simple_tree.c + _grid_density.cpp) com
          # gcc/g++ a partir do fonte, offline, a partir do /wheelhouse. É
          # trabalho de CPU genuíno. O GATE 2 do Dockerfile garante que /project
          # está pristino na imagem, então toda run compila do zero — nunca
          # incremental.
          #
          # PORTANTO: espera-se ratio > 0.5 nos DOIS stages. Um alerta no build
          # é SINAL REAL (ou a compilação não aconteceu — build incremental,
          # wheel pré-built vazando para o wheelhouse — ou a captura fd3
          # regrediu para o host), não ruído a ignorar. Investigar sempre.
          #
          # O `test` é serial (coverage run -m unittest, sem xdist), logo
          # espera-se ratio próximo de 1, não > 1 como no sktime com -n 4.
          alertar_user_sys() {
            local csv="$1" origem="$2"
            [ -f "$csv" ] || return 0
            awk -F, -v origem="$origem" '
              NR==1 { next }
              ($2=="build" || $2=="test") && $7+0 > 0 {
                r = ($8 + $9) / $7
                if (r < 0.5)
                  printf "::warning::[%s] stage %s: (user+sys)/wall = %.4f < 0.5 (user=%ss sys=%ss wall=%ss) — captura de user/sys pode ter regredido para o host, OU a compilação do build não aconteceu\n", origem, $2, r, $8, $9, $7
              }
            ' "$csv" | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          }

          # Sanity check NÃO bloqueante de paginação (colunas 12/13 do CSV:
          # swap_in_pages, swap_out_pages). O host mantém /swapfile de 16G como
          # salvaguarda de disponibilidade, mas o container medido roda com
          # memory.swap.max=0 e é incapaz de paginar. Um swap_out_pages > 0
          # significa que ALGUM processo do HOST paginou durante a janela medida
          # — pressão de memória que gera contenção de I/O no BX500 (sem DRAM) e
          # infla wall_time sem energia proporcional. Run suspeita: analisar
          # antes de incluir no conjunto válido. Ver docs/robustez_tesla.md §4.
          #
          # LIMIAR: o valor é SEMPRE gravado no CSV; o ::warning:: só dispara
          # acima de 256 páginas (1 MiB). Swap-out de ~15 páginas (60 KB) foi
          # medido em operação normal — é ruído. Alerta que dispara a 15 páginas
          # apareceria em quase toda run e seria aprendido como ignorável.
          #
          # No orange3 espera-se ZERO paginação: um único processo Python
          # serial, sem o aninhamento 4×8 do sktime, contra um teto de 12g.
          alertar_swap() {
            local csv="$1" origem="$2"
            [ -f "$csv" ] || return 0
            # CSVs anteriores à instrumentação não têm as colunas: NF<13 -> pula.
            awk -F, -v origem="$origem" -v LIMIAR="${SWAP_WARN_PAGES:-256}" '
              NR==1 { next }
              NF >= 13 && ($2=="build" || $2=="test") && $13+0 > LIMIAR {
                printf "::warning::[%s] stage %s: swap_out_pages=%s (swap_in_pages=%s, limiar %s) — houve paginação do host durante a janela medida; run suspeita por contenção de I/O\n", origem, $2, $13, $12, LIMIAR
              }
            ' "$csv" | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          }

          # --- Warm-up descartado (convenção: 11 runs, mediana sobre os 10 válidos) ---
          PENDENTES=0
          for i in $(seq 1 10); do
            validar_csv "$RESULTS_DIR/run_$(printf '%02d' "$i").csv" || PENDENTES=$((PENDENTES+1))
          done
          if [ "$PENDENTES" -gt 0 ]; then
            echo "::group::Warm-up (descartado da análise)"
            echo "🔥 $PENDENTES run(s) pendente(s) — executando warm-up antes dos runs oficiais"
            mkdir -p "$RESULTS_DIR/warmup"
            bash "$PIPELINE" 0
            mv -f "$RESULTS_DIR/run_00.csv" "$RESULTS_DIR/warmup/run_warmup.csv"
            alertar_user_sys "$RESULTS_DIR/warmup/run_warmup.csv" "warm-up"
            alertar_swap "$RESULTS_DIR/warmup/run_warmup.csv" "warm-up"
            {
              echo "## Warm-up executado e DESCARTADO (não entra na mediana)"
              echo "- $PENDENTES run(s) pendente(s) nesta sessão; CSV em \`runs/warmup/run_warmup.csv\` (sobrescrito a cada sessão)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
            echo "⏳ Repouso pós-warm-up (120s)..."
            sleep 120
          else
            echo "✅ Campanha já completa (10 runs válidas) — warm-up desnecessário"
            echo "## Warm-up pulado — campanha já estava completa" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "## Execução (modo completa) — skip-if-exists" >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 10); do
            NN=$(printf '%02d' "$i")
            CSV="$RESULTS_DIR/run_${NN}.csv"
            echo "::group::Run $i de 10"
            if validar_csv "$CSV"; then
              echo "✅ Run $NN já existe e é válida — pulando"
              echo "- Run $NN: já existe e é válida — **pulada**" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              continue
            fi
            if [ -f "$CSV" ]; then
              echo "♻️  Run $NN incompleta/inválida — reexecutando (sobrescreve)"
              echo "- Run $NN: CSV inválido/incompleto — **reexecutada**" >> "$GITHUB_STEP_SUMMARY"
              rm -f "$CSV"
            else
              echo "▶️  Run $NN ausente — executando"
              echo "- Run $NN: ausente — **executada**" >> "$GITHUB_STEP_SUMMARY"
            fi
            bash "$PIPELINE" "$i"
            alertar_user_sys "$CSV" "run $NN"
            alertar_swap "$CSV" "run $NN"
            echo "::endgroup::"
            if [ "$i" -lt 10 ]; then
              echo "⏳ Repouso entre runs (120s)..."
              sleep 120
            fi
          done

          # Varredura final: cobre também runs pré-existentes puladas pelo skip-if-exists.
          for i in $(seq 1 10); do
            NN=$(printf '%02d' "$i")
            alertar_user_sys "$RESULTS_DIR/run_${NN}.csv" "run $NN"
            alertar_swap "$RESULTS_DIR/run_${NN}.csv" "run $NN"
          done

      - name: Calcular medianas (após run 10)
        if: ${{ inputs.campaign == 'completa' }}
        run: |
          RESULTS_DIR="$HOME/experimentos/medicao/resultados/orange3/runs"
          SUMMARY="$HOME/experimentos/medicao/resultados/orange3/summary.csv"
          python3 "$HOME/experimentos/medicao/scripts/aggregate.py" "$RESULTS_DIR" "$SUMMARY"
          {
            echo ""
            echo "## Medianas (10 runs) — orange3"
            echo '```'
            cat "$SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Docker --privileged grava arquivos como root no workspace; corrige o dono
      # via container descartável (evita depender de sudo com senha no runner).
      - name: Corrigir permissões do workspace
        if: always()
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}":/w \
            alpine chown -R "$(id -u):$(id -g)" /w || true

      - name: Upload dos resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-orange3-${{ github.run_number }}
          # NOTA_FIDELIDADE.md é documento de consulta interna, local na tesla:
          # fica fora do artefato.
          path: |
            ${{ env.HOME_DIR }}/experimentos/medicao/resultados/orange3/
            !${{ env.HOME_DIR }}/experimentos/medicao/resultados/orange3/NOTA_FIDELIDADE.md
          retention-days: 90
